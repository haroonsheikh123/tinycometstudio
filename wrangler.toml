# Cloudflare Pages project config (used by `npx wrangler pages dev` / `deploy`).
# Secrets (TURNSTILE_SECRET, SIGNING_KEY, ENCRYPTION_KEY, SETUP_TOKEN) are NOT stored here — see README › Admin setup.
name = "tinycometstudio"
pages_build_output_dir = "public"
compatibility_date = "2025-07-18"

[vars]
# How long a solved captcha unlocks web play for (hours, max 24).
PLAY_TTL_HOURS = "4"
# Hostnames Turnstile tokens may come from (comma-separated). Leave empty to accept the request's own host.
ALLOWED_HOSTNAMES = ""
# production | preview | development — API keys can be limited to environments.
ENVIRONMENT = "production"
# Admin session timeouts.
SESSION_IDLE_MINUTES = "120"
SESSION_MAX_HOURS = "12"
# Used for optional Cloudflare zone cache purges (with CF_ZONE_ID + CF_API_TOKEN secrets).
SITE_URL = "https://tinycometstudio.com"

[env.preview.vars]
PLAY_TTL_HOURS = "4"
ALLOWED_HOSTNAMES = ""
ENVIRONMENT = "preview"
SESSION_IDLE_MINUTES = "120"
SESSION_MAX_HOURS = "12"
SITE_URL = "https://tinycometstudio.com"

# D1 = the content + admin database. Create it with:  npx wrangler d1 create tinycomet
# then paste the database_id it prints below (this one is a placeholder).
[[d1_databases]]
binding = "DB"
database_name = "tinycomet"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# R2 = media library, game builds and audit archives. Create it with:  npx wrangler r2 bucket create tinycomet-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tinycomet-media"
